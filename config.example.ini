[Startup]
# Legt fest, was beim Ausführen der Start.bat gestartet wird.
# True = StartFramework.py (Startet Meisterschaft & Shooting inkl. Layout-Automatik)
# False = MeisterschaftDeLuebs.py (Startet nur das reine Meisterschaftstool)
StartFramework = False

[Paths]
# =================================================================
# DATEI-PFADE ZU SHOOTING DELÜBS
# =================================================================
# Hier wird ChampionshipDeLuebs mit dem Schießstand verbunden.
# Es gibt zwei typische Szenarien für die Einrichtung:
#
# SZENARIO A: Lokaler Test am PC (ohne Raspberry Pi)
# Beide Programme liegen als Ordner nebeneinander (z.B. in C:\Projekte\).
# Nutze einfach die relativen Pfade. Die Standardwerte unten sind 
# bereits exakt für dieses Szenario vorkonfiguriert!
#
# SZENARIO B: Live-Turnier (Windows PC + Raspberry Pi 5)
# Der Raspberry Pi muss ZWEI Ordner im Netzwerk (Samba) freigeben. 
# Diese bindest du am Windows-PC als Netzlaufwerke (z.B. Z: und Y:) ein:
#
# 1. Freigabe für Highscores (SD-Karte des Pi):
#    Pi-Pfad: /home/pi/shooting/savegames
#    Am Windows-PC als Netzlaufwerk Z: verbinden.
#
# 2. Freigabe für Live-Daten (RAM-Disk des Pi - schont die SD-Karte!):
#    Pi-Pfad: /dev/shm/shooting_live
#    Am Windows-PC als Netzlaufwerk Y: verbinden.
# =================================================================

# 1. Die Highscore-Datei (Wird vom Pi und PC gelesen/geschrieben)
# Lokaler Test: ..\ShootingDeLuebs\savegames\highscore.json
# Live-Turnier: Z:\highscore.json
highscore_file = ..\ShootingDeLuebs\savegames\highscore.json

# 2. Die Match-Vorbereitung (Schreibt der PC, liest der Pi)
# Lokaler Test: ..\ShootingDeLuebs\savegames\next_match.csv
# Live-Turnier: Y:\next_match.csv
next_match_file = ..\ShootingDeLuebs\savegames\next_match.csv

# 3. Der Live-Ticker (Schreibt der Pi, liest der PC)
# Lokaler Test: ..\ShootingDeLuebs\savegames\live_match.json
# Live-Turnier: Y:\live_match.json
live_ticker_file = ..\ShootingDeLuebs\savegames\live_match.json


[Messages]
# Jede neue Zeile muss eingerückt sein!
templates =
    📸 Nutzt die WhatsApp-Gruppe für Eure Fotos! 📲
    🏁 Gruppenphase beendet! K.O.-Start um 16:00 Uhr! 🏆
    📢 ACHTUNG: Kurze Unterbrechung - Alle zum Beamer! 📢
    🍺 Kurze Pause, gleich geht es weiter!
    🔥 Ruhe bitte! K.O.-Match läuft! 🔥

